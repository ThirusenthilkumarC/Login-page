<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova — Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at 15% 20%, rgba(124, 58, 237, 0.18), transparent 30%),
                radial-gradient(circle at 85% 80%, rgba(6, 182, 212, 0.15), transparent 30%),
                #050505;

            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
            position: relative;
        }

        /* ================= BACKGROUND GLOW ================= */

        .glow {
            position: absolute;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            filter: blur(130px);
            opacity: 0.25;
            pointer-events: none;

            animation: float 9s ease-in-out infinite;
        }

        .glow-one {
            background: #7c3aed;
            top: -180px;
            left: -150px;
        }

        .glow-two {
            background: #06b6d4;
            right: -170px;
            bottom: -180px;
            animation-delay: 2s;
        }

        /* ================= GRID ================= */

        .grid {
            position: absolute;
            inset: 0;

            background-image:
                linear-gradient(
                    rgba(255, 255, 255, 0.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255, 255, 255, 0.025) 1px,
                    transparent 1px
                );

            background-size: 50px 50px;

            mask-image: linear-gradient(
                to bottom,
                transparent,
                black 20%,
                black 80%,
                transparent
            );

            pointer-events: none;
        }

        /* ================= PARTICLES ================= */

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;

            background: #fff;
            border-radius: 50%;
            opacity: 0.5;

            animation: particle 8s linear infinite;
            pointer-events: none;
        }

        .p1 {
            left: 15%;
            top: 70%;
        }

        .p2 {
            left: 80%;
            top: 30%;
            animation-delay: 2s;
        }

        .p3 {
            left: 50%;
            top: 15%;
            animation-delay: 4s;
        }

        .p4 {
            left: 30%;
            top: 30%;
            animation-delay: 1s;
        }

        .p5 {
            left: 65%;
            top: 75%;
            animation-delay: 3s;
        }

        /* ================= LOGIN CARD ================= */

        .login-container {
            width: 430px;
            max-width: calc(100% - 30px);

            padding: 45px 40px;

            background: rgba(255, 255, 255, 0.065);

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            border: 1px solid rgba(255, 255, 255, 0.13);
            border-radius: 28px;

            box-shadow:
                0 30px 100px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);

            position: relative;
            z-index: 10;

            animation: cardReveal 0.9s ease forwards;
        }

        .login-container::before {
            content: "";

            position: absolute;
            inset: 0;

            border-radius: inherit;

            background: linear-gradient(
                135deg,
                rgba(139, 92, 246, 0.08),
                transparent 40%,
                rgba(6, 182, 212, 0.06)
            );

            pointer-events: none;
        }

        /* ================= LOGO ================= */

        .logo {
            position: relative;

            text-align: center;

            font-size: 28px;
            font-weight: 800;
            letter-spacing: 5px;

            margin-bottom: 34px;
        }

        .logo span {
            color: #8b5cf6;

            text-shadow:
                0 0 20px rgba(139, 92, 246, 0.6);
        }

        /* ================= TITLE ================= */

        .title {
            position: relative;

            text-align: center;

            font-size: 32px;
            line-height: 1.2;

            margin-bottom: 9px;
        }

        .subtitle {
            position: relative;

            text-align: center;

            color: #8b8b8b;
            font-size: 14px;

            margin-bottom: 32px;
        }

        /* ================= INPUT ================= */

        .input-group {
            position: relative;
            margin-bottom: 18px;
        }

        .input-group input {
            width: 100%;

            padding: 16px 18px;

            background: rgba(255, 255, 255, 0.045);

            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;

            color: #fff;
            font-size: 15px;

            outline: none;

            transition:
                border 0.3s ease,
                box-shadow 0.3s ease,
                background 0.3s ease,
                transform 0.3s ease;
        }

        .input-group input::placeholder {
            color: #707070;
        }

        .input-group input:hover {
            background: rgba(255, 255, 255, 0.065);
        }

        .input-group input:focus {
            border-color: #8b5cf6;

            background: rgba(139, 92, 246, 0.055);

            box-shadow:
                0 0 0 3px rgba(139, 92, 246, 0.12),
                0 0 25px rgba(139, 92, 246, 0.08);
        }

        /* ================= OPTIONS ================= */

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;

            font-size: 13px;

            margin: 4px 0 25px;
        }

        .remember {
            display: flex;
            align-items: center;

            gap: 8px;

            color: #999;
            cursor: pointer;
        }

        .remember input {
            accent-color: #8b5cf6;
            cursor: pointer;
        }

        .forgot {
            color: #a78bfa;

            text-decoration: none;

            transition: 0.3s;
        }

        .forgot:hover {
            color: #c4b5fd;
        }

        /* ================= LOGIN BUTTON ================= */

        .login-btn {
            width: 100%;

            padding: 16px;

            border: none;
            border-radius: 14px;

            background:
                linear-gradient(
                    100deg,
                    #7c3aed,
                    #8b5cf6,
                    #06b6d4
                );

            background-size: 200% 100%;

            color: #fff;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease,
                background-position 0.5s ease;
        }

        .login-btn:hover {
            transform: translateY(-3px);

            background-position: 100% 0;

            box-shadow:
                0 15px 40px rgba(124, 58, 237, 0.35);
        }

        .login-btn:active {
            transform: translateY(-1px);
        }

        /* ================= DIVIDER ================= */

        .divider {
            display: flex;
            align-items: center;

            gap: 12px;

            color: #666;
            font-size: 11px;
            letter-spacing: 1px;

            margin: 28px 0;
        }

        .divider::before,
        .divider::after {
            content: "";

            height: 1px;
            flex: 1;

            background: rgba(255, 255, 255, 0.1);
        }

        /* ================= SOCIAL ================= */

        .social {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 12px;
        }

        .social button {
            padding: 13px;

            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;

            background: rgba(255, 255, 255, 0.035);

            color: #fff;

            font-size: 14px;

            cursor: pointer;

            transition:
                background 0.3s ease,
                transform 0.3s ease,
                border 0.3s ease;
        }

        .social button:hover {
            background: rgba(255, 255, 255, 0.09);

            border-color: rgba(255, 255, 255, 0.2);

            transform: translateY(-2px);
        }

        /* ================= SIGNUP ================= */

        .signup {
            position: relative;

            text-align: center;

            margin-top: 28px;

            color: #777;
            font-size: 14px;
        }

        .signup a {
            color: #a78bfa;

            text-decoration: none;

            font-weight: 600;

            transition: 0.3s;
        }

        .signup a:hover {
            color: #c4b5fd;
        }

        /* ================= ANIMATIONS ================= */

        @keyframes cardReveal {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.96);
                filter: blur(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        @keyframes float {
            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(80px, -60px);
            }
        }

        @keyframes particle {
            0% {
                transform: translateY(0);
                opacity: 0;
            }

            50% {
                opacity: 0.7;
            }

            100% {
                transform: translateY(-180px);
                opacity: 0;
            }
        }

        /* ================= MOBILE ================= */

        @media (max-width: 500px) {

            body {
                padding: 15px 0;
                overflow-y: auto;
            }

            .login-container {
                padding: 35px 24px;
                border-radius: 24px;
            }

            .logo {
                font-size: 25px;
                margin-bottom: 28px;
            }

            .title {
                font-size: 27px;
            }

            .subtitle {
                font-size: 13px;
                margin-bottom: 27px;
            }

            .options {
                font-size: 12px;
            }

            .social {
                grid-template-columns: 1fr;
            }
        }

        /* ================= REDUCED MOTION ================= */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <!-- Background -->

    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>

    <div class="grid"></div>

    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>
    <div class="particle p5"></div>


    <!-- Login Card -->

    <main class="login-container">

        <div class="logo">
            N<span>O</span>VA
        </div>

        <h1 class="title">
            Welcome Back
        </h1>

        <p class="subtitle">
            Sign in to continue your journey
        </p>


        <form>

            <div class="input-group">
                <input
                    type="email"
                    name="email"
                    placeholder="Email address"
                    autocomplete="email"
                    required
                >
            </div>


            <div class="input-group">
                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                >
            </div>


            <div class="options">

                <label class="remember">

                    <input
                        type="checkbox"
                        name="remember"
                    >

                    <span>Remember me</span>

                </label>


                <a
                    href="#"
                    class="forgot"
                >
                    Forgot password?
                </a>

            </div>


            <button
                class="login-btn"
                type="submit"
            >
                Sign In →
            </button>

        </form>


        <div class="divider">
            OR CONTINUE WITH
        </div>


        <div class="social">

            <button type="button">
                Google
            </button>

            <button type="button">
                GitHub
            </button>

        </div>


        <p class="signup">

            Don't have an account?

            <a href="#">
                Create account
            </a>

        </p>

    </main>

</body>
    </html>
